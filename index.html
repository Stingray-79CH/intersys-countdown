<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arbeitszeit buchen - Countdown</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --card: rgba(255, 255, 255, 0.94);
      --text: #111827;
      --muted: #64748b;
      --danger: #dc2626;
      --warning: #f59e0b;
      --blue: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.45), transparent 32%),
        radial-gradient(circle at bottom right, rgba(220, 38, 38, 0.35), transparent 34%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      overflow: hidden;
    }

    .page {
      width: min(1180px, 94vw);
      min-height: min(680px, 90vh);
      background: var(--card);
      border-radius: 36px;
      padding: 54px;
      box-shadow: 0 32px 90px rgba(0, 0, 0, 0.42);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 34px;
      position: relative;
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 18px;
      background: linear-gradient(90deg, var(--danger), var(--warning), var(--blue));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      z-index: 1;
    }

    .logo {
      max-width: 300px;
      height: auto;
    }

    .deadline-badge {
      padding: 16px 24px;
      border-radius: 999px;
      background: #fee2e2;
      color: #991b1b;
      font-size: clamp(20px, 2vw, 30px);
      font-weight: 800;
      border: 3px solid #fecaca;
      white-space: nowrap;
    }

    main {
      display: grid;
      place-items: center;
      text-align: center;
      z-index: 1;
    }

    .warning-icon {
      width: 118px;
      height: 118px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--danger);
      color: white;
      display: grid;
      place-items: center;
      font-size: 76px;
      font-weight: 900;
      box-shadow: 0 0 0 16px rgba(220, 38, 38, 0.14);
      animation: pulse 1.4s infinite ease-in-out;
    }

    h1 {
      margin: 0;
      color: var(--danger);
      font-size: clamp(48px, 6vw, 92px);
      line-height: 1.02;
      font-weight: 900;
      letter-spacing: -2px;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 18px 0 32px;
      color: var(--muted);
      font-size: clamp(24px, 2.5vw, 38px);
      font-weight: 700;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 18px;
      width: min(820px, 100%);
      margin: 0 auto;
    }

    .time-box {
      background: #0f172a;
      color: white;
      border-radius: 24px;
      padding: 24px 18px 20px;
      box-shadow: inset 0 -8px 0 rgba(255, 255, 255, 0.08);
    }

    .number {
      display: block;
      font-size: clamp(46px, 6vw, 84px);
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 10px;
      font-size: clamp(16px, 1.6vw, 24px);
      color: #cbd5e1;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      color: var(--muted);
      font-size: clamp(18px, 1.6vw, 26px);
      font-weight: 700;
      z-index: 1;
    }

    .now { font-variant-numeric: tabular-nums; }

    .daily-message {
      display: none;
      max-width: 900px;
      margin: 0 auto;
      padding: 34px 38px;
      border-radius: 28px;
      background: #eff6ff;
      border: 3px solid #bfdbfe;
      color: #1e3a8a;
      font-size: clamp(28px, 3vw, 46px);
      font-weight: 800;
      line-height: 1.25;
    }

    body.daily-mode .countdown,
    body.daily-mode .subtitle,
    body.daily-mode .warning-icon {
      display: none;
    }

    body.daily-mode .daily-message {
      display: block;
    }

    body.daily-mode h1 {
      color: var(--blue);
      font-size: clamp(42px, 5vw, 74px);
      margin-bottom: 28px;
    }

    body.daily-mode .deadline-badge {
      background: #dbeafe;
      color: #1e3a8a;
      border-color: #bfdbfe;
    }

    .expired .warning-icon,
    .urgent .warning-icon {
      animation: pulse-fast 0.75s infinite ease-in-out;
    }

    .urgent .time-box,
    .expired .time-box {
      background: #7f1d1d;
    }

    .expired h1::after {
      content: " – Deadline erreicht";
      display: block;
      font-size: clamp(28px, 3vw, 44px);
      margin-top: 12px;
      color: #7f1d1d;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes pulse-fast {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 12px rgba(220, 38, 38, 0.18); }
      50% { transform: scale(1.12); box-shadow: 0 0 0 28px rgba(220, 38, 38, 0.08); }
    }

    @media (max-width: 820px) {
      .page {
        padding: 34px;
        border-radius: 24px;
      }

      header,
      footer {
        flex-direction: column;
        text-align: center;
      }

      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }

      .deadline-badge {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <section class="page" aria-label="Arbeitszeit buchen Countdown">
    <header>
      <img class="logo" src="https://intersys.ch/wp-content/uploads/2023/06/Intersys_Logo_RGB-01.svg" alt="Intersys Logo" />
      <div id="deadline-badge" class="deadline-badge">Deadline wird berechnet…</div>
    </header>

    <main>
      <div>
        <div class="warning-icon" aria-hidden="true">!</div>
        <h1 id="headline">Achtung bitte Zeit buchen</h1>
        <p class="subtitle">Verbleibende Zeit bis zur Deadline</p>
        <div class="daily-message">Bitte die Arbeitszeit täglich buchen.</div>

        <div class="countdown" role="timer" aria-live="polite">
          <div class="time-box">
            <span id="days" class="number">00</span>
            <span class="label">Tage</span>
          </div>
          <div class="time-box">
            <span id="hours" class="number">00</span>
            <span class="label">Stunden</span>
          </div>
          <div class="time-box">
            <span id="minutes" class="number">00</span>
            <span class="label">Minuten</span>
          </div>
          <div class="time-box">
            <span id="seconds" class="number">00</span>
            <span class="label">Sekunden</span>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div>Bitte erledige die Buchung rechtzeitig.</div>
      <div class="now">Aktuelle Zeit: <span id="current-time">--:--:--</span></div>
    </footer>
  </section>

  <script>
    const TIME_ZONE = 'Europe/Zurich';

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const currentTimeEl = document.getElementById('current-time');
    const deadlineBadgeEl = document.getElementById('deadline-badge');
    const headlineEl = document.getElementById('headline');

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function getZurichParts(date = new Date()) {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: TIME_ZONE,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hourCycle: 'h23'
      }).formatToParts(date);

      return Object.fromEntries(parts.map(part => [part.type, part.value]));
    }

    // Wandelt eine lokale Zeit in Europe/Zurich in einen echten Date-Zeitpunkt um.
    function zurichDate(year, month, day, hour = 0, minute = 0, second = 0) {
      const utcGuess = Date.UTC(year, month - 1, day, hour, minute, second);
      const guessDate = new Date(utcGuess);
      const p = getZurichParts(guessDate);
      const representedAsUtc = Date.UTC(
        Number(p.year), Number(p.month) - 1, Number(p.day),
        Number(p.hour), Number(p.minute), Number(p.second)
      );
      const offset = representedAsUtc - utcGuess;
      return new Date(utcGuess - offset);
    }

    function getLastWorkday(year, month) {
      // 0 = Sonntag, 6 = Samstag. Es werden nur Montag bis Freitag berücksichtigt.
      const lastDayNumber = new Date(Date.UTC(year, month, 0)).getUTCDate();

      for (let day = lastDayNumber; day >= 1; day--) {
        const weekday = new Date(Date.UTC(year, month - 1, day)).getUTCDay();
        if (weekday !== 0 && weekday !== 6) {
          return day;
        }
      }
    }

    function getMonthlyDeadline(now = new Date()) {
      const p = getZurichParts(now);
      const year = Number(p.year);
      const month = Number(p.month);
      const currentDay = Number(p.day);
      const lastWorkday = getLastWorkday(year, month);

      return {
        currentDay,
        deadline: zurichDate(year, month, lastWorkday, 18, 0, 0),
        year,
        month,
        lastWorkday
      };
    }

    function formatDeadline(date) {
      return new Intl.DateTimeFormat('de-CH', {
        timeZone: TIME_ZONE,
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      }).format(date) + ' Uhr';
    }

    function updateCountdown() {
      const now = new Date();
      const { currentDay, deadline } = getMonthlyDeadline(now);

      currentTimeEl.textContent = new Intl.DateTimeFormat('de-CH', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        timeZone: TIME_ZONE
      }).format(now);

      document.body.classList.remove('daily-mode', 'urgent', 'expired');

      // Vom 1. bis und mit 14. des Monats: noch kein Countdown.
      if (currentDay < 15) {
        document.body.classList.add('daily-mode');
        deadlineBadgeEl.textContent = 'Countdown startet am 15. des Monats';
        headlineEl.textContent = 'Arbeitszeit täglich buchen';
        return;
      }

      headlineEl.textContent = 'Achtung bitte Zeit buchen';
      deadlineBadgeEl.textContent = 'Deadline: ' + formatDeadline(deadline);

      const diff = deadline - now;

      if (diff <= 0) {
        daysEl.textContent = '00';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        document.body.classList.add('expired');
        return;
      }

      if (diff <= 24 * 60 * 60 * 1000) {
        document.body.classList.add('urgent');
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
